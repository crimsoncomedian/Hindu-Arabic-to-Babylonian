<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hindu-Arabic to Babylonian Numerals</title>

  <style>
    :root {
      --page-bg: #f4f7fb;
      --card: #ffffff;
      --panel: #f8fafc;

      --text: #172033;
      --muted: #667085;

      --border: #dbe2ea;
      --border-dark: #cbd5e1;

      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #eff6ff;

      --green: #166534;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;

      --red: #991b1b;
      --red-bg: #fff7f7;
      --red-border: #fecaca;

      --shadow:
        0 1px 2px rgba(16, 24, 40, 0.04),
        0 4px 14px rgba(16, 24, 40, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(950px, calc(100% - 28px));
      margin: 30px auto;
    }

    .card {
      padding: 22px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow: var(--shadow);
    }

    /* ==================================================
       PROMPT
       ================================================== */

    .prompt {
      text-align: center;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .number {
      margin: 18px 0 7px;

      text-align: center;

      color: var(--text);

      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
    }

    .subprompt {
      text-align: center;

      color: var(--muted);

      font-size: 0.84rem;
      line-height: 1.45;
    }

    /* ==================================================
       ANSWER
       ================================================== */

    .answer-label {
      margin: 21px 0 10px;

      text-align: center;

      font-weight: 750;
    }

    .places {
      display: flex;
      align-items: stretch;
      justify-content: center;

      gap: 12px;
      flex-wrap: wrap;
    }

    .place {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      min-width: 118px;
      min-height: 112px;

      padding: 10px;

      border: 1.5px solid var(--border);
      border-radius: 11px;

      background: var(--card);
      color: var(--text);

      cursor: pointer;
    }

    .place:hover {
      background: var(--panel);
    }

    .place.selected {
      background: var(--blue-soft);

      border-color: var(--blue);

      box-shadow:
        inset 0 0 0 1px var(--blue);
    }

    .place-number {
      position: absolute;

      top: 6px;
      left: 8px;

      color: var(--muted);

      font-size: 0.68rem;
      font-weight: 700;
    }

    .empty-place {
      color: var(--muted);

      text-align: center;

      font-size: 0.8rem;
      line-height: 1.35;
    }

    /* ==================================================
       BUILDER
       ================================================== */

    .builder {
      margin-top: 16px;
      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: var(--panel);
    }

    .builder-title {
      margin-bottom: 10px;

      text-align: center;

      color: var(--muted);

      font-size: 0.8rem;
      font-weight: 750;
    }

    .symbol-buttons {
      display: flex;
      justify-content: center;

      gap: 10px;
      flex-wrap: wrap;
    }

    .symbol-button {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      min-width: 115px;
      min-height: 64px;

      padding: 6px 11px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--card);
      color: var(--text);

      font-weight: 750;

      cursor: pointer;
    }

    .symbol-button:hover {
      background: #fbfcfe;
      border-color: var(--border-dark);
    }

    .edit-actions {
      display: flex;
      justify-content: center;

      gap: 8px;
      flex-wrap: wrap;

      margin-top: 11px;
    }

    /* ==================================================
       BUTTONS
       ================================================== */

    .button {
      min-height: 42px;

      padding: 8px 15px;

      border-radius: 9px;

      font-weight: 700;

      cursor: pointer;
    }

    .primary {
      border: 1px solid var(--blue);

      background: var(--blue);
      color: white;
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .secondary {
      border: 1px solid var(--border);

      background: var(--card);
      color: var(--text);
    }

    .secondary:hover {
      background: var(--panel);
    }

    .main-actions {
      display: flex;
      justify-content: center;

      gap: 9px;
      flex-wrap: wrap;

      margin-top: 19px;
    }

    /* ==================================================
       FEEDBACK
       ================================================== */

    .feedback {
      display: none;

      margin-top: 17px;

      border-radius: 11px;

      overflow: hidden;

      line-height: 1.45;
    }

    .feedback.correct {
      display: block;

      padding: 14px 16px;

      border: 1px solid var(--green-border);

      background: var(--green-bg);
      color: var(--green);
    }

    .feedback.incorrect {
      display: block;

      border: 1px solid var(--red-border);

      background: var(--red-bg);
      color: var(--text);
    }

    .feedback-head {
      padding: 14px 16px;

      color: var(--red);
    }

    /* ==================================================
       EXPLANATION
       ================================================== */

    .explanation {
      padding: 15px 16px;

      border-top: 1px solid var(--red-border);

      background: var(--card);
    }

    .explanation-title {
      margin-bottom: 10px;

      font-weight: 750;
    }

    .correct-places {
      display: flex;
      justify-content: center;

      gap: 10px;
      flex-wrap: wrap;

      margin: 11px 0;
    }

    .correct-place {
      display: flex;
      align-items: center;
      justify-content: center;

      min-width: 104px;
      min-height: 96px;

      padding: 8px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--panel);
    }

    .math-box {
      margin-top: 10px;

      padding: 11px;

      border-radius: 9px;

      background: var(--blue-soft);

      text-align: center;

      font-weight: 750;
      line-height: 1.5;
    }

    /* ==================================================
       REFERENCE
       ================================================== */

    .reference {
      margin-top: 19px;
      padding-top: 14px;

      border-top: 1px solid var(--border);
    }

    .reference-title {
      margin-bottom: 9px;

      text-align: center;

      color: var(--muted);

      font-size: 0.76rem;
      font-weight: 750;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .reference-grid {
      display: flex;
      justify-content: center;

      gap: 16px;
      flex-wrap: wrap;
    }

    .reference-item {
      display: flex;
      align-items: center;

      gap: 7px;

      padding: 7px 10px;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: var(--panel);

      font-size: 0.84rem;
    }

    svg {
      display: block;
      overflow: visible;
      margin: auto;
    }

    /* ==================================================
       RESPONSIVE
       ================================================== */

    @media (max-width: 520px) {

      .app {
        width: min(100% - 18px, 950px);
        margin: 18px auto;
      }

      .card {
        padding: 15px 12px;
      }

      .number {
        font-size: 2.5rem;
      }

      .place {
        min-width: 102px;
        min-height: 104px;
      }

    }
  </style>
</head>

<body>

<main class="app">

  <section class="card">

    <!-- ==================================================
         PROMPT
         ================================================== -->

    <div class="prompt">
      Write this Hindu-Arabic numeral as a Babylonian numeral.
    </div>

    <div
      id="problemNumber"
      class="number">
      487
    </div>

    <div class="subprompt">
      Select a place, then use the Babylonian symbols to build your answer.
    </div>


    <!-- ==================================================
         ANSWER
         ================================================== -->

    <div class="answer-label">
      Your Babylonian numeral
    </div>

    <div
      id="places"
      class="places">
    </div>


    <!-- ==================================================
         SYMBOL BUILDER
         ================================================== -->

    <div class="builder">

      <div
        id="builderTitle"
        class="builder-title">
        Selected place: 1
      </div>


      <div class="symbol-buttons">

        <button
          id="addTenButton"
          class="symbol-button"
          type="button">

          <span id="tenButtonSymbol"></span>

          <span>
            + 10
          </span>

        </button>


        <button
          id="addOneButton"
          class="symbol-button"
          type="button">

          <span id="oneButtonSymbol"></span>

          <span>
            + 1
          </span>

        </button>

      </div>


      <div class="edit-actions">

        <button
          id="undoButton"
          class="button secondary"
          type="button">
          Undo Last Symbol
        </button>

        <button
          id="clearButton"
          class="button secondary"
          type="button">
          Clear This Place
        </button>

      </div>

    </div>


    <!-- ==================================================
         MAIN CONTROLS
         ================================================== -->

    <div class="main-actions">

      <button
        id="checkButton"
        class="button primary"
        type="button">
        Check Answer
      </button>

      <button
        id="nextButton"
        class="button secondary"
        type="button">
        Next Question
      </button>

    </div>


    <!-- ==================================================
         FEEDBACK
         ================================================== -->

    <div
      id="feedback"
      class="feedback"
      aria-live="polite">
    </div>


    <!-- ==================================================
         REFERENCE
         ================================================== -->

    <div class="reference">

      <div class="reference-title">
        Babylonian Symbol Reference
      </div>

      <div class="reference-grid">

        <div class="reference-item">

          <span id="tenReference"></span>

          <strong>
            = 10
          </strong>

        </div>


        <div class="reference-item">

          <span id="oneReference"></span>

          <strong>
            = 1
          </strong>

        </div>

      </div>

    </div>

  </section>

</main>


<script>

(() => {

  /*
    ==================================================
    DOM
    ==================================================
  */

  const problemNumber =
    document.getElementById(
      "problemNumber"
    );


  const placesElement =
    document.getElementById(
      "places"
    );


  const builderTitle =
    document.getElementById(
      "builderTitle"
    );


  const addTenButton =
    document.getElementById(
      "addTenButton"
    );


  const addOneButton =
    document.getElementById(
      "addOneButton"
    );


  const undoButton =
    document.getElementById(
      "undoButton"
    );


  const clearButton =
    document.getElementById(
      "clearButton"
    );


  const checkButton =
    document.getElementById(
      "checkButton"
    );


  const nextButton =
    document.getElementById(
      "nextButton"
    );


  const feedback =
    document.getElementById(
      "feedback"
    );


  /*
    ==================================================
    STATE
    ==================================================
  */

  let targetNumber =
    1;


  let targetDigits =
    [1];


  let answerDigits =
    [];


  let histories =
    [];


  let selectedPlace =
    0;


  let previousNumber =
    null;


  /*
    ==================================================
    BABYLONIAN SYMBOLS
    ==================================================
  */

  function drawOne(
    x,
    y,
    scale = 1
  ) {

    return `
      <g
        transform="
          translate(${x} ${y})
          scale(${scale})
        ">

        <path
          d="
            M0 0
            L16 0
            L11 7
            L9 26
            L7 26
            L5 7
            Z
          "
          fill="currentColor">
        </path>

        <path
          d="
            M5 7
            L11 7
            L8 12
            Z
          "
          fill="white">
        </path>

      </g>
    `;

  }


  function drawTen(
    x,
    y,
    scale = 1
  ) {

    return `
      <g
        transform="
          translate(${x} ${y})
          scale(${scale})
        ">

        <path
          d="
            M0 10
            L17 0
            L12 9
            L17 19
            Z
          "
          fill="currentColor">
        </path>

        <path
          d="
            M4 10
            L12 5
            L9 10
            L12 15
            Z
          "
          fill="white">
        </path>

      </g>
    `;

  }


  /*
    ==================================================
    SYMBOL ARRANGEMENT
    ==================================================
  */

  function getPositions(
    count,
    type
  ) {

    const positions =
      [];


    const columnGap =
      type === "ten"
        ? 22
        : 18;


    const rowGap =
      type === "ten"
        ? 22
        : 29;


    let remaining =
      count;


    let row =
      0;


    while (
      remaining >
      0
    ) {

      const inRow =
        Math.min(
          3,
          remaining
        );


      const width =
        (
          inRow -
          1
        ) *
        columnGap;


      const startX =
        -width /
        2;


      for (
        let column = 0;
        column < inRow;
        column++
      ) {

        positions.push({

          x:
            startX +
            column *
            columnGap,

          y:
            row *
            rowGap

        });

      }


      remaining -=
        inRow;


      row++;

    }


    return positions;

  }


  function createSymbolGroup(
    count,
    type
  ) {

    if (
      count <=
      0
    ) {

      return "";

    }


    const positions =
      getPositions(
        count,
        type
      );


    const rows =
      Math.ceil(
        count /
        3
      );


    const width =
      type === "ten"
        ? 78
        : 66;


    const height =
      type === "ten"

        ? Math.max(
            24,
            rows *
              22 +
              10
          )

        : Math.max(
            32,
            rows *
              29 +
              8
          );


    const center =
      width /
      2;


    let marks =
      "";


    positions.forEach(
      position => {

        if (
          type ===
          "one"
        ) {

          marks +=
            drawOne(
              center +
                position.x -
                8,

              4 +
                position.y,

              0.9
            );

        }

        else {

          marks +=
            drawTen(
              center +
                position.x -
                8,

              4 +
                position.y,

              0.9
            );

        }

      }
    );


    return `
      <svg
        width="${width}"
        height="${height}"
        viewBox="0 0 ${width} ${height}"
        style="color: var(--text)"
        aria-hidden="true">

        ${marks}

      </svg>
    `;

  }


  /*
    ==================================================
    RENDER ONE BASE-60 DIGIT
    ==================================================
  */

  function renderDigit(
    value
  ) {

    if (
      value <=
      0
    ) {

      return `
        <span class="empty-place">

          Click +10 or +1
          <br>
          to add symbols

        </span>
      `;

    }


    const tens =
      Math.floor(
        value /
        10
      );


    const ones =
      value %
      10;


    return `
      <div
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          gap:2px;
        ">

        ${
          tens
            ? createSymbolGroup(
                tens,
                "ten"
              )
            : ""
        }

        ${
          ones
            ? createSymbolGroup(
                ones,
                "one"
              )
            : ""
        }

      </div>
    `;

  }


  /*
    ==================================================
    CONVERT TO BASE 60
    ==================================================
  */

  function toBase60(
    value
  ) {

    const result =
      [];


    let number =
      value;


    while (
      number >
      0
    ) {

      result.unshift(
        number %
        60
      );


      number =
        Math.floor(
          number /
          60
        );

    }


    return result.length
      ? result
      : [0];

  }


  /*
    ==================================================
    RANDOM NUMBER GENERATION
    ==================================================

    About 80% of problems are below 1000.

    ==================================================
  */

  function weightedRandomNumber() {

    const random =
      Math.random();


    if (
      random <
      0.80
    ) {

      return (
        1 +
        Math.floor(
          Math.random() *
          999
        )
      );

    }


    if (
      random <
      0.96
    ) {

      return (
        1000 +
        Math.floor(
          Math.random() *
          2600
        )
      );

    }


    return (
      3600 +
      Math.floor(
        Math.random() *
        6401
      )
    );

  }


  /*
    ==================================================
    GENERATE PROBLEM
    ==================================================

    Zero base-60 digits are avoided here
    so the activity does not require the
    Babylonian placeholder symbol.

    ==================================================
  */

  function generateTarget() {

    let number;

    let digits;


    do {

      number =
        weightedRandomNumber();


      if (
        number >
        10000
      ) {

        number =
          10000;

      }


      digits =
        toBase60(
          number
        );

    }

    while (

      digits.some(
        value =>
          value === 0
      )

      ||

      number ===
        previousNumber

    );


    targetNumber =
      number;


    targetDigits =
      digits;


    previousNumber =
      number;

  }


  /*
    ==================================================
    RENDER STUDENT ANSWER PLACES
    ==================================================
  */

  function renderPlaces() {

    placesElement.innerHTML =
      answerDigits
        .map(
          (
            value,
            index
          ) => {

            return `
              <button
                type="button"
                class="
                  place
                  ${
                    index ===
                    selectedPlace

                      ? "selected"
                      : ""
                  }
                "
                data-index="${index}"
                aria-label="
                  Babylonian place
                  ${index + 1}
                ">

                <span class="place-number">

                  Place
                  ${index + 1}

                </span>

                ${renderDigit(
                  value
                )}

              </button>
            `;

          }
        )
        .join("");


    const placeButtons =
      [
        ...placesElement.querySelectorAll(
          ".place"
        )
      ];


    placeButtons.forEach(
      button => {

        button.addEventListener(
          "click",

          function () {

            selectedPlace =
              Number(
                button.dataset.index
              );


            renderPlaces();

            updateBuilderTitle();

          }

        );

      }
    );

  }


  /*
    ==================================================
    BUILDER
    ==================================================
  */

  function updateBuilderTitle() {

    builderTitle.textContent =
      `Selected place: ${selectedPlace + 1} of ${answerDigits.length}`;

  }


  function resetFeedback() {

    feedback.className =
      "feedback";


    feedback.innerHTML =
      "";

  }


  function addValue(
    amount,
    type
  ) {

    const currentValue =
      answerDigits[
        selectedPlace
      ];


    if (
      currentValue +
      amount >
      59
    ) {

      feedback.className =
        "feedback incorrect";


      feedback.innerHTML =
        `
          <div class="feedback-head">

            <strong>

              A Babylonian place can only
              have a value from 1 to 59.

            </strong>

          </div>
        `;


      return;

    }


    answerDigits[
      selectedPlace
    ] +=
      amount;


    histories[
      selectedPlace
    ].push(
      type
    );


    resetFeedback();

    renderPlaces();

  }


  /*
    ==================================================
    UNDO
    ==================================================
  */

  function undoLastSymbol() {

    const history =
      histories[
        selectedPlace
      ];


    if (
      !history.length
    ) {

      return;

    }


    const type =
      history.pop();


    if (
      type ===
      "ten"
    ) {

      answerDigits[
        selectedPlace
      ] -=
        10;

    }

    else {

      answerDigits[
        selectedPlace
      ] -=
        1;

    }


    resetFeedback();

    renderPlaces();

  }


  /*
    ==================================================
    CLEAR PLACE
    ==================================================
  */

  function clearSelectedPlace() {

    answerDigits[
      selectedPlace
    ] =
      0;


    histories[
      selectedPlace
    ] =
      [];


    resetFeedback();

    renderPlaces();

  }


  /*
    ==================================================
    CORRECT ANSWER EXPLANATION
    ==================================================
  */

  function buildExplanation() {

    const placeCount =
      targetDigits.length;


    const pieces =
      [];


    const correctNumeral =
      targetDigits
        .map(
          digit => {

            return `
              <div class="correct-place">

                ${renderDigit(
                  digit
                )}

              </div>
            `;

          }
        )
        .join("");


    targetDigits.forEach(
      (
        digit,
        index
      ) => {

        const placeValue =
          Math.pow(
            60,
            placeCount -
              1 -
              index
          );


        pieces.push(
          `${digit} × ${placeValue.toLocaleString(
            "en-US"
          )}`
        );

      }
    );


    return `
      <div class="explanation">

        <div class="explanation-title">
          The correct Babylonian numeral is:
        </div>


        <div class="correct-places">

          ${correctNumeral}

        </div>


        <div class="math-box">

          ${pieces.join(" + ")}

          =

          ${targetNumber.toLocaleString(
            "en-US"
          )}

        </div>

      </div>
    `;

  }


  /*
    ==================================================
    CHECK ANSWER
    ==================================================
  */

  function checkAnswer() {

    if (
      answerDigits.some(
        value =>
          value === 0
      )
    ) {

      feedback.className =
        "feedback incorrect";


      feedback.innerHTML =
        `
          <div class="feedback-head">

            <strong>
              Finish every place before
              checking your answer.
            </strong>

          </div>
        `;


      return;

    }


    const correct =
      answerDigits.length ===
        targetDigits.length

      &&

      answerDigits.every(
        (
          value,
          index
        ) =>
          value ===
          targetDigits[
            index
          ]
      );


    if (
      correct
    ) {

      feedback.className =
        "feedback correct";


      feedback.innerHTML =
        `
          <strong>
            ✓ Correct!
          </strong>

          ${targetNumber.toLocaleString(
            "en-US"
          )}

          is written correctly in
          Babylonian numerals.
        `;


      return;

    }


    feedback.className =
      "feedback incorrect";


    feedback.innerHTML =
      `
        <div class="feedback-head">

          <strong>
            Not quite.
          </strong>

          Check the value of each
          base-60 place.

        </div>

        ${buildExplanation()}
      `;

  }


  /*
    ==================================================
    NEW QUESTION
    ==================================================
  */

  function newQuestion() {

    generateTarget();


    answerDigits =
      targetDigits.map(
        () =>
          0
      );


    histories =
      targetDigits.map(
        () =>
          []
      );


    selectedPlace =
      0;


    problemNumber.textContent =
      targetNumber.toLocaleString(
        "en-US"
      );


    resetFeedback();

    renderPlaces();

    updateBuilderTitle();

  }


  /*
    ==================================================
    EVENTS
    ==================================================
  */

  addTenButton.addEventListener(
    "click",

    function () {

      addValue(
        10,
        "ten"
      );

    }
  );


  addOneButton.addEventListener(
    "click",

    function () {

      addValue(
        1,
        "one"
      );

    }
  );


  undoButton.addEventListener(
    "click",
    undoLastSymbol
  );


  clearButton.addEventListener(
    "click",
    clearSelectedPlace
  );


  checkButton.addEventListener(
    "click",
    checkAnswer
  );


  nextButton.addEventListener(
    "click",
    newQuestion
  );


  /*
    ==================================================
    REFERENCE SYMBOLS
    ==================================================
  */

  document.getElementById(
    "tenButtonSymbol"
  ).innerHTML =
    createSymbolGroup(
      1,
      "ten"
    );


  document.getElementById(
    "oneButtonSymbol"
  ).innerHTML =
    createSymbolGroup(
      1,
      "one"
    );


  document.getElementById(
    "tenReference"
  ).innerHTML =
    createSymbolGroup(
      1,
      "ten"
    );


  document.getElementById(
    "oneReference"
  ).innerHTML =
    createSymbolGroup(
      1,
      "one"
    );


  /*
    ==================================================
    START
    ==================================================
  */

  newQuestion();

})();
</script>

</body>
</html>
